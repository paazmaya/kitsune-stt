name: CI
permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Install Rust
      uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
      with:
        toolchain: stable
        components: rustfmt, clippy

    # Cache Cargo dependencies, https://github.com/Swatinem/rust-cache
    - name: Rust Cache
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    - name: Install system dependencies (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config

    # https://github.com/cargo-bins/cargo-binstall
    - name: Install binary installation tool for cargo
      uses: cargo-bins/cargo-binstall@851112458b5f28a29e5bc14a690c3f283d9dcc6f # v1.26.2

    # https://github.com/xd009642/tarpaulin
    - name: Install code coverage tool
      run: cargo binstall cargo-tarpaulin
      # Install takes a bit over 4 mins, while binstall 12 seconds

    - name: Run cargo audit
      run: cargo audit

    - name: Run cargo fmt
      run: cargo fmt --all -- --check

    - name: Run cargo clippy
      run: cargo clippy -- -D warnings

    - name: Run cargo test
      run: cargo test --verbose

    - name: Run cargo doc
      run: cargo doc --no-deps
      # Don't fail on documentation warnings for now
      continue-on-error: true
