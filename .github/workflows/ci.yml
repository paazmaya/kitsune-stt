name: CI
permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test Suite
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6

    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy

    # Cache Cargo dependencies, https://github.com/Swatinem/rust-cache
    - name: Rust Cache
      uses: Swatinem/rust-cache@v2.9.1

    - name: Install system dependencies (Ubuntu)
      run: |
        sudo apt-get update
        sudo apt-get install -y pkg-config

    # https://github.com/cargo-bins/cargo-binstall
    - name: Install binary installation tool for cargo
      uses: cargo-bins/cargo-binstall@main

    # https://github.com/xd009642/tarpaulin
    - name: Install code coverage tool
      run: cargo binstall cargo-tarpaulin
      # Install takes a bit over 4 mins, while binstall 12 seconds

    - name: Run cargo audit
      run: cargo audit

    - name: Run cargo fmt
      run: cargo fmt --all -- --check

    - name: Run cargo clippy
      run: cargo clippy -- -D warnings

    - name: Run cargo test
      run: cargo test --verbose

    - name: Run cargo doc
      run: cargo doc --no-deps
      # Don't fail on documentation warnings for now
      continue-on-error: true
